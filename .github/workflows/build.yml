name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install cython
        python3 -m pip install buildozer

    - name: Build with Buildozer
      run: |
        export PATH=$HOME/.local/bin:$PATH
        rm -f buildozer.spec
        buildozer init
        
        # Configura i parametri di base
        sed -i 's/# title = My Application/title = Trachtenberg App/' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = trachtenbergapp/' buildozer.spec
        sed -i 's/# package.domain = org.example/package.domain = org.trachtenberg/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy,pillow/' buildozer.spec
        sed -i 's/# orientation = portrait/orientation = portrait/' buildozer.spec
        
        # Configura API e build tools stabili
        sed -i 's/# android.api = 31/android.api = 33/' buildozer.spec
        sed -i 's/# android.min_api = 21/android.min_api = 21/' buildozer.spec
        echo "android.build_tools_version = 33.0.2" >> buildozer.spec

        # Esegue prima un comando per accettare le licenze dell'SDK Android in automatico
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bab16c544281ef3954d762f2e0f49cf5368a" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n24333f8a43b681623c28dd16896734778793b56d" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

        # Avvia la compilazione
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
