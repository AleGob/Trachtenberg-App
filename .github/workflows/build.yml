name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install cython
        python3 -m pip install buildozer

    - name: Build with Buildozer
      run: |
        # Forza l'inclusione dei binari nel PATH di Linux
        export PATH=$HOME/.local/bin:$PATH
        # Stampa la cartella corrente per sicurezza e avvia buildozer
        pwd
        ls -la
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
