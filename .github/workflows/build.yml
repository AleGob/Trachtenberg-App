name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04 # Fissiamo una versione stabile per evitare i bug di "ubuntu-latest"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install cython
        python3 -m pip install buildozer

    - name: Fix Android SDK & Accept Licenses (The Magic Fix)
      run: |
        # Scarichiamo l'SDK manualmente
        mkdir -p ~/.buildozer/android/platform/android-sdk
        cd ~/.buildozer/android/platform/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
        unzip -q commandlinetools-linux-6514223_latest.zip
        
        # Rinominiamo la cartella per aggirare il bug di Buildozer
        rm -rf tools
        mv cmdline-tools tools
        
        # Accettiamo TUTTE le licenze di Android forzando i "yes"
        yes | ./tools/bin/sdkmanager --licenses

    - name: Generate buildozer.spec and Build
      run: |
        export PATH=$HOME/.local/bin:$PATH
        
        # Creiamo il file perfetto
        cat << 'EOF' > buildozer.spec
        [app]
        title = Trachtenberg App
        package.name = trachtenbergapp
        package.domain = org.trachtenberg
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy,pillow
        orientation = portrait
        fullscreen = 0
        android.accept_sdk_license = True
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        # Avviamo la compilazione (ora troverà la cartella 'tools' e non crasherà)
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
