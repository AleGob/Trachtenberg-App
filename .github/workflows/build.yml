name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install cython buildozer

    - name: Generate buildozer.spec and Build
      run: |
        export PATH=$HOME/.local/bin:$PATH
        
        # Creazione pulita del file di configurazione
        cat << 'EOF' > buildozer.spec
        [app]
        title = Trachtenberg App
        package.name = trachtenbergapp
        package.domain = org.trachtenberg
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy,pillow
        orientation = portrait
        fullscreen = 0
        
        # LA MAGIA: fa accettare le licenze in automatico a Buildozer
        android.accept_sdk_license = True
        
        # Fissiamo API stabili per evitare i Build-Tools buggati
        android.api = 33
        android.min_api = 21
        android.build_tools_version = 33.0.2
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        # Lasciamo fare tutto a Buildozer!
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
