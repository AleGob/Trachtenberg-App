name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Usiamo una versione moderna e stabile

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip
        # Torniamo alle versioni stabili ufficiali, senza rami sperimentali!
        python3 -m pip install "cython<3.0.0" buildozer

    - name: Setup Android SDK Path
      run: |
        # I server GitHub hanno già l'SDK perfetto pre-installato.
        # Creiamo solo un collegamento simbolico per aiutare Buildozer a trovare gli strumenti.
        sudo ln -s $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools

    - name: Generate buildozer.spec and Build
      run: |
        export PATH=$HOME/.local/bin:$PATH
        
        cat << 'EOF' > buildozer.spec
        [app]
        title = Trachtenberg App
        package.name = trachtenbergapp
        package.domain = org.trachtenberg
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        
        requirements = python3,kivy==2.3.0,pillow
        
        orientation = portrait
        fullscreen = 0
        
        # Diciamo a Buildozer di usare l'SDK di sistema invece di scaricarne uno rotto
        android.sdk_path = /usr/local/lib/android/sdk
        android.accept_sdk_license = True
        android.api = 33
        android.min_api = 21
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        # Via alla compilazione pulita!
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
