name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip
        # Usiamo il Cython "d'oro" perfetto per Kivy 2.3.0
        python3 -m pip install "Cython==0.29.33" buildozer

    - name: Generate buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = Trachtenberg App
        package.name = trachtenbergapp
        package.domain = org.trachtenberg
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        
        requirements = python3,kivy==2.3.0,pillow
        
        orientation = portrait
        fullscreen = 0
        android.accept_sdk_license = True
        android.api = 33
        android.min_api = 21
        
        # IL FIX FINALE: Usiamo l'NDK 25b per evitare il compilatore rotto di Google
        android.ndk = 25b
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: THE NUKE (Bypass GNU Server Crash)
      run: |
        export PATH=$HOME/.local/bin:$PATH
        buildozer android p4a -- --help || true
        find .buildozer/android/platform/python-for-android -type f -name "__init__.py" -exec sed -i 's|https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz|https://downloads.sourceforge.net/project/freetype/freetype2/{version}/freetype-{version}.tar.gz|g' {} +
        mkdir -p .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
        wget -qO .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype/freetype-2.14.1.tar.gz https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz

    - name: Build with Buildozer
      run: |
        export PATH=$HOME/.local/bin:$PATH
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
