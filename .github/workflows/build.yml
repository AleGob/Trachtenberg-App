name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install cython
        python3 -m pip install buildozer

    - name: Build with Buildozer
      run: |
        export PATH=$HOME/.local/bin:$PATH
        
        # Crea la cartella delle licenze Android in anticipo per evitare blocchi
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bab16c544281ef3954d762f2e0f49cf5368a" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n24333f8a43b681623c28dd16896734778793b56d" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

        # Avvia la compilazione usando il file buildozer.spec fisso nel repository
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
